name: Presentation OpenAPI contract
on:
  pull_request:
    paths:
      - 'docs/openapi/**'
      - '.github/workflows/presentation-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt openapi-spec-validator
      - run: openapi-spec-validator docs/openapi/presentation-api-v1.yaml
      - run: python -m pytest docs/openapi/test_contract.py -q
        env:
          PYTHONPATH: engine
      - run: git diff --check
