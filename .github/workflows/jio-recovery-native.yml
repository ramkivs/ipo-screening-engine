name: Jio focused native API recovery
on:
  push:
    branches: [arena/95234306-ipo-screening-engine]
    paths:
      - .github/workflows/jio-recovery-native.yml
      - docs/investigation/jio-recovery/native_api.py
      - docs/investigation/jio-recovery/source_inventory.py
      - engine/ipo_screening/presentation/service.py
      - engine/ipo_screening/presentation/ingestion_activity.py
      - engine/ipo_screening/issue_term_fields.py
      - tests/test_ingestion_activity.py
      - tests/test_issue_terms_multisource.py
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  actual-api:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Focused activity, conflict and explicit NIL safety checks only
        env:
          PYTHONPATH: engine
        run: python -m pytest -q tests/test_ingestion_activity.py tests/test_issue_terms_multisource.py tests/test_ofs_nil_binding.py
      - name: Actual HTTP upload, terminal GET, durable restart and conditional duplicate
        env:
          PYTHONPATH: engine
          PYTHONUNBUFFERED: '1'
          JIO_RECOVERY_OUTPUT: ${{ runner.temp }}/jio-native-api
          LIVE_CHECK_TOKEN: ${{ github.token }}
        run: python docs/investigation/jio-recovery/native_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jio-native-api-evidence
          path: ${{ runner.temp }}/jio-native-api
