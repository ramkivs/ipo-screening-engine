name: A9 contract boundary regression
on:
  push:
    branches: [arena/07f3439f-ipo-screening-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      # This validates the current fail-closed contract, NOT qualified admission.
      - name: Backend regression with API-visible failure diagnostics
        env:
          PYTHONPATH: engine
        shell: bash
        run: |
          mkdir -p build
          status=0
          python -m pytest tests/ -q --junitxml=build/a9-results.xml || status=$?
          python - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("build/a9-results.xml")
          if path.exists():
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      for error in case.findall(kind):
                          text = f"{case.get('classname')}.{case.get('name')}: {error.text}"
                          text = text[:12000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error::{text}")
              for suite in root.iter("testsuite"):
                  print("Test totals:", suite.attrib)
          PYTHON
          exit "$status"
      - run: npm test --prefix frontend
        if: always()
      - name: Schema and integrity checks
        if: always()
        env:
          PYTHONPATH: engine
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          from ipo_screening.post_listing.v16_implementation import (
              verify_frozen_core, verify_golden_result, verify_v1_6_implementation,
          )
          for path in Path("schema").glob("*.json"):
              schema = json.loads(path.read_text())
              validator_for(schema).check_schema(schema)
          assert verify_frozen_core()[0]
          assert verify_golden_result()[0]
          report = verify_v1_6_implementation()
          assert report["status"] == "PASS", report
          print("Schemas, frozen core, golden result and inactive v1.6: PASS")
          PYTHON
      - run: python -m compileall -q engine
        if: always()
      - run: git diff --exit-code && git diff --check
        if: always()
