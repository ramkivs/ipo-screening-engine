name: A9 contract boundary regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'frontend/**'
      - 'schema/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/a9-contract-regression.yml'
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Fast PR checks, full regression, or focused A9 linkage
        type: choice
        options: [fast, full, linkage]
        default: fast
        required: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # Pull requests are intentionally fast. Full regression runs nightly or
      # by explicit manual dispatch only; it must not block normal iteration.
      A9_TEST_SCOPE: ${{ inputs.scope || (github.event_name == 'schedule' && 'full') || 'fast' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix frontend
      - name: Backend regression with API-visible failure diagnostics
        env:
          PYTHONPATH: engine
        shell: bash
        run: |
          mkdir -p build
          status=0
          case "$A9_TEST_SCOPE" in
            fast)
              target=(
                tests/test_secondary_scenario_workbench.py
                tests/test_workbench_browser_hydration.py
                tests/test_working_capital_extension.py
                tests/test_governance_extension.py
                tests/test_segment_risk_extension.py
                tests/test_regulatory_risk_extension.py
                tests/test_presentation_api.py
                tests/test_cli.py
                tests/test_suite_tiers.py
              )
              ;;
            full) target=(tests/) ;;
            linkage) target=(tests/test_gmp_evidence_linkage.py tests/test_gmp_binding.py tests/test_gmp_retained_inventory.py tests/test_gmp_mechanics.py) ;;
            *) echo "Unsupported A9 test scope" >&2; exit 2 ;;
          esac
          echo "A9 contract boundary regression scope: $A9_TEST_SCOPE"
          python -m pytest "${target[@]}" -q --junitxml=build/a9-results.xml || status=$?
          python - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("build/a9-results.xml")
          if path.exists():
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      for error in case.findall(kind):
                          text = f"{case.get('classname')}.{case.get('name')}: {error.text}"
                          text = text[:12000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error::{text}")
              for suite in root.iter("testsuite"):
                  print("Test totals:", suite.attrib)
                  print("::notice::A9 selected-suite totals: " + str(suite.attrib))
          PYTHON
          exit "$status"
      - run: npm test --prefix frontend
        if: always() && env.A9_TEST_SCOPE != 'linkage'
      - name: Schema and integrity checks
        if: always()
        env:
          PYTHONPATH: engine
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          from ipo_screening.post_listing.v16_implementation import (
              verify_frozen_core, verify_golden_result, verify_v1_6_implementation,
          )
          for path in Path("schema").glob("*.json"):
              schema = json.loads(path.read_text())
              validator_for(schema).check_schema(schema)
          assert verify_frozen_core()[0]
          assert verify_golden_result()[0]
          report = verify_v1_6_implementation()
          assert report["status"] == "PASS", report
          print("Schemas, frozen core, golden result and inactive v1.6: PASS")
          PYTHON
      - run: python -m compileall -q engine
        if: always()
      - run: git diff --exit-code && git diff --check
        if: always()
