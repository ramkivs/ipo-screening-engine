name: Live official exchange discovery investigation
on:
  push:
    branches: [arena/95234306-ipo-screening-engine]
    paths: [.github/workflows/official-discovery-live.yml]
permissions:
  contents: read
jobs:
  actual-exchange-http:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Focused automatic discovery regressions
        env:
          PYTHONPATH: engine
        run: python -m pytest -q tests/test_automatic_official_issue_discovery.py tests/test_official_discovery.py tests/test_issue_terms_windows_retrieval.py -m "not slow"
      - name: Actual production HTTP exchange response probe
        env:
          PYTHONPATH: engine
        run: python -u docs/investigation/automatic-official-discovery-2026-10-21/probe_live.py nse
      - name: Actual BSE public page and archive behaviour
        env:
          PYTHONPATH: engine
        run: python -u docs/investigation/automatic-official-discovery-2026-10-21/probe_live.py bse
      - name: Inspect actual discovered official document parsing
        env:
          PYTHONPATH: engine
        run: python -u docs/investigation/automatic-official-discovery-2026-10-21/inspect_documents.py
      - name: Real Jio PDF and live official discovery through evaluation gates
        env:
          PYTHONPATH: engine
        run: python -u docs/investigation/automatic-official-discovery-2026-10-21/verify_live_ingestion.py
