      operationId: listCalibrationProposals
      tags: [Calibration]
      responses:
        '200':
          description: Governed calibration proposals with provenance hashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationProposalListResponse'

        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
