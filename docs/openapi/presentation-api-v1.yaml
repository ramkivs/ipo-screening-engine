      tags: [Configuration]
      responses:
        '200':
          description: Current active and candidate configuration lifecycle status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStatusResponse'

        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /ingest/document:
    post:
      summary: Ingest and evaluate an IPO filing document (DRHP/RHP PDF)
      description: |
        Uploads a PDF filing document, extracts domain entities using DocumentExtractor,
        converts into CanonicalInput, validates, runs deterministic evaluation,
        and persists the record to the immutable EvaluationStore.
        Duplicate uploads return the existing evaluation idempotently.
      operationId: ingestDocument
      tags: [Ingestion]
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_document_api_v1_ingest_document_post'
        required: true
      responses:
        '200':
          description: Existing evaluation returned for a duplicate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '201':
          description: New evaluation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '400':
          description: Bad request (invalid PDF magic bytes, empty file, or invalid mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: File exceeds 50 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Request validation failed, issue terms are required, or processing failed.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing or cross-origin Origin; lifecycle actions may also reject protected records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected ingestion error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
        - name: Origin
          in: header
          required: true
          description: Must match the request scheme and loopback Host.
          schema:
            type: string
  /evaluations/{evaluation_id}/archive:
    post:
      summary: Archive a historical evaluation execution
      description: |
        Reversibly transitions an evaluation to ARCHIVED visibility state.
        Removes the evaluation from default operational and directory views while
        preserving 100% of underlying immutable files, hashes, and audit evidence.
        Active evaluations cannot be archived unless the offering is withdrawn.
        Tier 1 Golden evaluations cannot be archived.
      operationId: archiveEvaluation
      tags: [Lifecycle]
      parameters:
        - name: evaluation_id
          in: path
          required: true
          schema:
            type: string
            title: Evaluation Id
        - name: Origin
          in: header
          required: true
          description: Must match the request scheme and loopback Host.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/LifecycleActionRequest'
                - type: 'null'
      responses:
        '200':
          description: Evaluation successfully archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleActionResponse'
        '403':
          description: Forbidden (Tier 1 golden evaluation cannot be archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Evaluation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict (invalid state transition, e.g. archiving active evaluation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluations/{evaluation_id}/unarchive:
    post:
      summary: Unarchive an archived evaluation execution
      description: |
        Restores an archived evaluation to VISIBLE state within the historical timeline.
        Does not automatically promote the evaluation to ACTIVE.
      operationId: unarchiveEvaluation
      tags: [Lifecycle]
      parameters:
        - name: evaluation_id
          in: path
          required: true
          schema:
            type: string
            title: Evaluation Id
        - name: Origin
          in: header
          required: true
          description: Must match the request scheme and loopback Host.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/LifecycleActionRequest'
                - type: 'null'
      responses:
        '200':
          description: Evaluation successfully unarchived to VISIBLE state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleActionResponse'
        '404':
          description: Evaluation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict (evaluation is not archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Missing or cross-origin Origin; lifecycle actions may also reject protected records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /evaluations/{evaluation_id}/make-active:
    post:
      summary: Designate a historical evaluation as authoritative ACTIVE (Governed Rollback)
      description: |
        Designates the target evaluation as the authoritative ACTIVE evaluation for its mode.
        Automatically demotes any incumbent active evaluation to SUPERSEDED with lineage pointer.
        Requires evaluation to have been scored under the ratified active policy.
      operationId: makeEvaluationActive
      tags: [Lifecycle]
      parameters:
        - name: evaluation_id
          in: path
          required: true
          schema:
            type: string
            title: Evaluation Id
        - name: Origin
          in: header
          required: true
          description: Must match the request scheme and loopback Host.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/LifecycleActionRequest'
                - type: 'null'
      responses:
        '200':
          description: Evaluation successfully designated as ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleActionResponse'
        '400':
          description: Bad request (cyclic lineage detected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Evaluation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict (unratified policy or invalid state transition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Missing or cross-origin Origin; lifecycle actions may also reject protected records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
