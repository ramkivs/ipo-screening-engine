openapi: 3.1.0
info:
  title: IPO Screening Engine — Presentation Read-Model API
  version: 1.0.0
  description: |
    Personal-use presentation API projecting immutable evaluation, post-listing,
    backtesting, and calibration records. GET routes provide read models; the
    only supported writes are documented POST actions for filing ingestion and
    evaluation lifecycle transitions. Scoring and configuration are not mutable
    through this API.

    PRINCIPLES:
    - Limited write surface: document ingestion, manual-terms ingestion, asynchronous ingestion start, and evaluation lifecycle actions only.
    - Authoritative source of truth remains the EvaluationStore and related artifacts on disk.
    - Zero client-side or API-side duplicate scoring or metric calculation.
    - Explicit preservation of UNKNOWN, NOT_APPLICABLE, and INSUFFICIENT_DATA semantics.
    - No model provider or external data credentials are exposed.
    - Requests are accepted only with a literal localhost/loopback Host authority (DNS-rebinding hosts are rejected).
    - Workflow POSTs require a matching same-origin Origin header; missing or cross-origin headers are rejected.
servers:
  - url: /api/v1
    description: Presentation API v1 prefix

paths:
  /health:
    get:
      summary: Service health check
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: Service is healthy; read_only is false because explicit workflow POST actions are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /meta:
