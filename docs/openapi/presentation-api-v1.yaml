  /ingest/manual-terms:
    post:
      tags:
        - Ingestion
      summary: Ingest Document Manual Terms
      description: Manual values are labelled MANUAL_ENTRY, not official verification. OFS and fresh issue are monetary
        amounts in the filing reporting unit; explicit zero is retained. Conflicts return 409 until confirmed; a
        verified official value is never displaced.
      operationId: ingest_document_manual_terms_api_v1_ingest_manual_terms_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_document_manual_terms_api_v1_ingest_manual_terms_post'
        required: true
      responses:
        '200':
          description: Existing evaluation returned for a duplicate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '422':
          description: Request validation failed, issue terms are required, or processing failed.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing or cross-origin Origin; lifecycle actions may also reject protected records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '201':
          description: New evaluation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '413':
          description: File exceeds 50 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected ingestion error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Issue term conflict; conflicts contains details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
        - name: Origin
          in: header
          required: true
          description: Must match the request scheme and loopback Host.
          schema:
            type: string
  /ingestions/start:
    post:
      tags:
        - Ingestion
      summary: Start Ingestion
      description: "Start a traced ingestion in the background (202).\n\nReturns the ingestion/correlation id immediately;
        the client\npolls ``/ingestions/{id}`` and ``/ingestions/{id}/events`` for\nthe live, durable activity trace.  Processing
        itself is the\nunchanged synchronous service path running on a thread."
      operationId: start_ingestion_api_v1_ingestions_start_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_start_ingestion_api_v1_ingestions_start_post'
        required: true
      responses:
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing or cross-origin Origin; lifecycle actions may also reject protected records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '202':
          description: Ingestion dispatched; poll the activity and events URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionStarted'
        '413':
          description: File exceeds 50 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
        - name: Origin
          in: header
          required: true
          description: Must match the request scheme and loopback Host.
          schema:
            type: string
  /ingestions/{ingestion_id}:
    get:
      tags:
        - Ingestion
      summary: Get Ingestion Activity
      operationId: get_ingestion_activity_api_v1_ingestions__ingestion_id__get
      parameters:
        - name: ingestion_id
          in: path
          required: true
          schema:
            type: string
            title: Ingestion Id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionActivityDetail'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /ingestions/{ingestion_id}/events:
    get:
      tags:
        - Ingestion
      summary: Get Ingestion Events
      operationId: get_ingestion_events_api_v1_ingestions__ingestion_id__events_get
      parameters:
        - name: ingestion_id
          in: path
          required: true
          schema:
            type: string
            title: Ingestion Id
