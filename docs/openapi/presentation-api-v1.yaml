  /calibration/proposals/{proposal_id}:
    get:
      summary: Retrieve detailed calibration proposal artifact
      operationId: getCalibrationProposal
      tags: [Calibration]
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
            title: Proposal Id
      responses:
        '200':
          description: Full calibration proposal artifact with shadow evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationProposal'
        '404':
          description: Calibration proposal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '400':
          description: Invalid request or non-loopback Host (LOOPBACK_HOST_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Request validation failed
          content:
            application/json:
